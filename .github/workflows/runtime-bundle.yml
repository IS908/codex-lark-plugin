name: Runtime bundle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify marketplace bundle from lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run check:runtime-bundle-sync
      - run: npm run check:release-version
      - run: node --import tsx scripts/plugin-runtime-package-smoke.ts
      - run: node --import tsx scripts/start-sh-smoke.ts
